name: CI

on:
  push:
    branches: ["main", "fix/*"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - uses: pnpm/action-setup@v3
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run typecheck
      - run: pnpm run check:security-model
      - run: pnpm run check:packaging
      - run: pnpm run build
      - run: pnpm run docs:api
      - run: pnpm run test:coverage
      - run: pnpm run test:examples
      - name: Run benchmarks (report-only)
        run: pnpm run bench
        continue-on-error: true

  stellar-sdk-compatibility:
    name: Stellar SDK ${{ matrix.sdk-version }} compatibility
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sdk-version: ["17.1.0", "17.4.0"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v3
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - name: Install target @stellar/stellar-sdk version
        run: pnpm add -D @stellar/stellar-sdk@${{ matrix.sdk-version }}
      - run: pnpm run build
      - run: pnpm test
      - run: pnpm run test:examples
